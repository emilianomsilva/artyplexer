name: Build Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Build binary with PyInstaller
        env:
          PYTHONUTF8: "1"
        run: uv run python build_installer.py

      - name: Package Linux archive
        run: |
          cd dist
          tar -czvf artyplexer-linux-x64.tar.gz artyplexer artyplexer.desktop

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: artyplexer-linux-x64
          path: dist/artyplexer-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Build binary with PyInstaller
        env:
          PYTHONUTF8: "1"
        run: uv run python build_installer.py

      - name: Build Windows Installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: artyplexer-windows-x64
          path: dist/Artyplexer-Setup.exe

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: artyplexer-linux-x64
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: artyplexer-windows-x64
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
