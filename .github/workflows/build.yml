name: Build Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist
            artifact: artyplexer-linux-x64
            files: dist/*.deb
          - os: windows-latest
            script: dist:win
            artifact: artyplexer-windows-x64
            files: dist/*.exe
          - os: macos-15
            script: dist:mac
            artifact: artyplexer-macos-arm64
            files: dist/*-mac-arm64.dmg
          - os: macos-15-intel
            script: dist:mac
            artifact: artyplexer-macos-x64
            files: dist/*-mac-x64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: cargo test --manifest-path rust-helper/Cargo.toml
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
